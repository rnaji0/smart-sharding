[project]
name = "engine-collector"
version = "0.1.0"
description = "Polls citus_observer telemetry from every node of a Citus cluster into DuckDB"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "duckdb>=1.1",
]

[project.scripts]
engine-collector = "engine_collector.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine_collector"]

[tool.pytest.ini_options]
markers = ["cluster: needs the running Citus cluster with citus_observer installed"]
