# Included from postgresql.conf on every node (coordinator, workers, replicas).

listen_addresses = '*'
shared_preload_libraries = 'citus,pg_stat_statements'
citus.enable_statistics_collection = off

# Online shard moves/splits use logical replication.
wal_level = logical
max_replication_slots = 32
max_wal_senders = 32
max_logical_replication_workers = 16
max_worker_processes = 32
hot_standby = on

# Sized for ~1.5 GB per container.
max_connections = 300
shared_buffers = 384MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB

# Observability the controller reads.
track_io_timing = on
track_activity_query_size = 4096
pg_stat_statements.track = all
pg_stat_statements.max = 10000
citus.stat_statements_track = all
citus.stat_tenants_track = all
citus.stat_tenants_period = 60

log_min_duration_statement = 1000
log_lock_waits = on
deadlock_timeout = 1s
