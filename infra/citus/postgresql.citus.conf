# Included from postgresql.conf on every node (coordinator, workers, replicas).

listen_addresses = '*'
shared_preload_libraries = 'citus,pg_stat_statements'
citus.enable_statistics_collection = off

# Online shard moves/splits use logical replication.
wal_level = logical
max_replication_slots = 32
max_wal_senders = 32
max_logical_replication_workers = 16
max_worker_processes = 32
hot_standby = on

# Sized for ~1.5 GB per container.
max_connections = 400

# Cap outgoing connections each node opens to any other node. Every node can
# originate distributed work (coordinator + workers fetching repartition
# results), so with 3 peers x 100 incoming plus clients we stay under 400.
citus.max_shared_pool_size = 100
shared_buffers = 384MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB

# Observability the controller reads.
track_io_timing = on
track_activity_query_size = 4096
pg_stat_statements.track = all
pg_stat_statements.max = 10000
citus.stat_statements_track = all
citus.stat_tenants_track = all
citus.stat_tenants_period = 60

# citus_observer: engine telemetry (see engine/citus/src/backend/distributed/observer).
# Change data capture makes Citus mark its own shard move/split copies with a
# replication origin, so the change capture slot can skip them.
citus.enable_change_data_capture = on
# Bound the WAL a stalled change capture slot can retain.
max_slot_wal_keep_size = 2GB

log_min_duration_statement = 1000
log_lock_waits = on
deadlock_timeout = 1s
